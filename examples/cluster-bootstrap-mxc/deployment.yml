# Example Kluctl deployment template mapping adapters
deployments:
  - path: ../mxc-library/adapters/kluctl
    tags: [infra, traefik]
    vars:
      - values:
          <<: {{ template.helm.bjws.app_template.v4_x }}
      - values:
          context: {{ apps.traefik.context }}
          helmChart:
            releaseName: traefik
            namespace: "{{ apps.traefik.kustomize.namespace }}"
          kustomize:
            namespace: "{{ apps.traefik.kustomize.namespace }}"
            resources:
              - helm-rendered.yaml
