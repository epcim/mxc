clusterName: cluster-standalone
environment: development
global:
  ecr: containers.homelab.lan
  internalDomain: homelab.lan
  externalDomain: homelab.lan
kube:
  storageClass: local-path
  ingressClass: traefik
network:
  domain: homelab.lan
  vips:
    traefik: 192.168.1.50
    traefik_svc: 192.168.1.51
apps:
  traefik:
    appName: traefik
    context:
      controllers:
        main:
          containers:
            main:
              ports:
                - name: web
                  containerPort: 80
                  protocol: TCP
                - name: websecure
                  containerPort: 443
                  protocol: TCP
      ingress: {}
      service:
        main:
          controller: main
          ports:
            web:
              port: 80
            websecure:
              port: 443
    deployment: kluctl
    helmChart:
      repo: https://traefik.github.io/charts
      chartName: traefik
      chartVersion: 34.2.0
      releaseName: traefik
      namespace: sys
    kustomize:
      resources:
        - helm-rendered.yaml
      namespace: sys
  homarr:
    appName: homarr
    context:
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/ajnart/homarr
                tag: 0.16.0
              ports:
                - name: http
                  containerPort: 7575
                  protocol: TCP
      ingress:
        http:
          enabled: true
          className: traefik
          hosts:
            - host: homarr.homelab.lan
              paths:
                - path: /
                  service:
                    identifier: main
                    port: http
          tls:
            - hosts:
                - homarr.homelab.lan
      service:
        main:
          controller: main
          ports:
            http:
              port: 7575
    deployment: kluctl
    helmChart:
      repo: https://bjw-s-labs.github.io/helm-charts
      chartName: app-template
      chartVersion: 4.6.2
      releaseName: homarr
      namespace: home
    kustomize:
      resources:
        - helm-rendered.yaml
      namespace: home
  silo:
    appName: silo
    context:
      controllers:
        main:
          containers:
            main:
              image:
                repository: ghcr.io/silo-server/silo-server
                tag: latest
              ports:
                - name: http
                  containerPort: 8080
                  protocol: TCP
      ingress:
        http:
          enabled: true
          className: traefik
          hosts:
            - host: silo.homelab.lan
              paths:
                - path: /
                  service:
                    identifier: main
                    port: http
          tls:
            - hosts:
                - silo.homelab.lan
      service:
        main:
          controller: main
          ports:
            http:
              port: 8080
    deployment: kluctl
    helmChart:
      repo: https://bjw-s-labs.github.io/helm-charts
      chartName: app-template
      chartVersion: 4.6.2
      releaseName: silo
      namespace: media
    kustomize:
      resources:
        - helm-rendered.yaml
      namespace: media
overlays:
  pvc: []
