deployments:
  - path: ../../../adapters/kluctl
    tags: [infra, traefik]
    vars:
      - values: {{ apps.infra.traefik | to_json }}
      - values:
          secrets:
            infra:
              admin: {{ secrets.infra.admin | to_json }}

  - path: ../../../adapters/kluctl
    tags: [home, homarr]
    vars:
      - values: {{ apps.home.homarr | to_json }}
      - values:
          secrets:
            homarr: {{ secrets.homarr | to_json }}

  - path: ../../../adapters/kluctl
    tags: [media, silo]
    vars:
      - values: {{ apps.media.silo | to_json }}
      - values:
          secrets:
            media:
              silo: {{ secrets.media.silo | to_json }}
