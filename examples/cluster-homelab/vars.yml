clusterName: cluster-homelab
environment: development
global:
  ecr: containers.homelab.lan
  internalDomain: homelab.lan
  externalDomain: homelab.lan
kube:
  storageClass: local-path
  ingressClass: traefik
network:
  domain: homelab.lan
  vips:
    traefik: 192.168.1.50
    traefik_svc: 192.168.1.51
apps:
  homarr:
    appName: homarr
    context:
      controllers:
        main:
          serviceAccount:
            name: homarr
          containers:
            main:
              env:
                SECRET_ENCRYPTION_KEY: '{{ secrets.homarr.encryption_key }}'
              image:
                repository: ghcr.io/ajnart/homarr
                tag: 0.16.0
              ports:
                - name: http
                  containerPort: 7575
                  protocol: TCP
      ingress:
        http:
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
            traefik.ingress.kubernetes.io/router.tls: "true"
            hajimari.io/enable: "true"
            hajimari.io/icon: view-dashboard
            hajimari.io/group: home
            hajimari.io/appName: Homarr
            hajimari.io/instance: main,int
          enabled: true
          className: traefik
          hosts:
            - host: homarr.homelab.lan
              paths:
                - path: /
                  service:
                    identifier: main
                    port: http
          tls:
            - hosts:
                - homarr.homelab.lan
      persistence:
        appdata:
          enabled: true
          type: persistentVolumeClaim
          existingClaim: homarr-appdata
          globalMounts:
            - path: /appdata
      service:
        main:
          controller: main
          ports:
            http:
              port: 7575
    deployment: kluctl
    helmChart:
      namespace: home
      repo: https://bjw-s-labs.github.io/helm-charts
      chartName: app-template
      chartVersion: 4.6.2
      releaseName: homarr
      skipCRDs: false
      skipPrePull: true
    kustomize:
      resources:
        - helm-rendered.yaml
        - overlays/cue-overlays.yaml
      namespace: home
      labels:
        - includeSelectors: true
          pairs:
            app: homarr
    kustomize_overlays:
      - apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: homarr
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata:
          name: homarr-k8s-viewer
        rules:
          - apiGroups:
              - ""
            resources:
              - pods
              - services
              - nodes
              - namespaces
              - configmaps
              - secrets
            verbs:
              - get
              - list
              - watch
          - apiGroups:
              - apps
            resources:
              - deployments
              - statefulsets
              - daemonsets
            verbs:
              - get
              - list
              - watch
          - apiGroups:
              - networking.k8s.io
            resources:
              - ingresses
              - networkpolicies
            verbs:
              - get
              - list
              - watch
          - apiGroups:
              - traefik.io
              - traefik.containo.us
            resources:
              - ingressroutes
              - middlewares
              - tlsoptions
            verbs:
              - get
              - list
              - watch
      - apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: homarr-k8s-viewer-binding
        subjects:
          - kind: ServiceAccount
            name: homarr
            namespace: home
        roleRef:
          kind: ClusterRole
          name: homarr-k8s-viewer
          apiGroup: rbac.authorization.k8s.io
    tags:
      - home
      - homarr
  metallb:
    appName: metallb
    context:
      l2advertisement:
        default-l2:
          ipAddressPools:
            - default-pool
          interfaces:
            - br0
      ipaddresspool:
        default-pool:
          - 192.168.1.32/27
    deployment: kluctl
    kustomize:
      resources:
        - https://raw.githubusercontent.com/metallb/metallb/v0.14.9/config/manifests/metallb-native.yaml
      namespace: metallb
      labels:
        - includeSelectors: true
          pairs:
            app: metallb
      patches:
        - target:
            group: apiextensions.k8s.io
            kind: CustomResourceDefinition
            name: bgppeers.metallb.io
          patch: '[{"op": "remove", "path": "/spec/conversion/webhook/clientConfig/caBundle"}]'
    tags:
      - infra
      - metallb
  traefik:
    appName: traefik
    context:
      fullnameOverride: traefik
      globalArguments:
        - --providers.kubernetesingress.ingressendpoint.ip=192.168.1.50
        - --providers.kubernetesingress.ingressClass=traefik
      service:
        loadBalancerSourceRanges:
          - 172.31.0.0/12
          - 192.168.0.0/16
          - 10.0.0.0/8
        spec:
          loadBalancerIP: 192.168.1.50
      persistence:
        storageClass: local-path
      ports:
        ssh:
          port: 8222
          exposedPort: 22
          expose:
            default: true
        metrics:
          port: 8082
          exposedPort: 8082
          expose:
            default: true
        traefik:
          expose:
            default: true
        web:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
        websecure:
          expose:
            default: true
          tls:
            certResolver: cloudflare
            domains:
              - main: '{{ args.domain }}'
                sans:
                  - '*.{{ args.domain }}'
      certificatesResolvers:
        cloudflare:
          acme:
            email: '{{ secrets.infra.admin.email }}'
            caServer: https://acme-v02.api.letsencrypt.org/directory
            dnsChallenge:
              provider: cloudflare
              resolvers: 1.1.1.1
            storage: /data/acme.json
      env:
        - name: CF_API_EMAIL
          value: '{{ secrets.infra.admin.email }}'
        - name: CF_DNS_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflare-api
              key: '{{ args.domain }}'
    deployment: kluctl
    helmChart:
      repo: https://traefik.github.io/charts
      chartName: traefik
      chartVersion: 34.2.0
      releaseName: traefik
      namespace: sys
      skipCRDs: true
      skipPrePull: true
    kustomize:
      resources:
        - helm-rendered.yaml
      namespace: sys
    tags:
      - infra
      - traefik
  silo:
    appName: silo
    context:
      controllers:
        main:
          type: deployment
          initContainers:
            init-redis-permissions:
              image:
                repository: busybox
                tag: latest
              command:
                - sh
                - -c
                - chown -R 999:999 /data
              securityContext:
                runAsUser: 0
          containers:
            main:
              image:
                repository: ghcr.io/silo-server/silo-server
                tag: latest
              env:
                TZ: Europe/Prague
                SMTP_HOST: '{{ secrets.infra.notifications.host }}'
                SMTP_PORT: '{{ secrets.infra.notifications.port }}'
                SMTP_USER: '{{ secrets.infra.notifications.user }}'
                SMTP_PASS: '{{ secrets.infra.notifications.pass }}'
                SMTP_FROM: '{{ secrets.infra.notifications.addr }}'
                MODE: integrated
                SECRET_KEY: '{{ secrets.media.silo.secretKey }}'
                DATABASE_URL: postgres://silo:silo@localhost:5432/silo?sslmode=disable
                REDIS_URL: redis://localhost:6379
                SILO_PLUGIN_CACHE_DIR: /var/lib/silo/plugins
              ports:
                - name: http
                  containerPort: 8080
                  protocol: TCP
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              probes:
                liveness:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      path: /api/v1/health
                      port: 8080
                    initialDelaySeconds: 30
                    periodSeconds: 20
                    timeoutSeconds: 5
                    failureThreshold: 6
                readiness:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      path: /api/v1/ready
                      port: 8080
                    initialDelaySeconds: 20
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 18
                startup:
                  enabled: true
                  custom: true
                  spec:
                    httpGet:
                      path: /api/v1/ready
                      port: 8080
                    initialDelaySeconds: 40
                    periodSeconds: 10
                    timeoutSeconds: 5
                    failureThreshold: 36
            postgres:
              image:
                repository: pgvector/pgvector
                tag: pg17
              env:
                POSTGRES_USER: silo
                POSTGRES_PASSWORD: silo
                POSTGRES_DB: silo
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
            redis:
              image:
                repository: redis
                tag: alpine
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
      ingress:
        http:
          annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: websecure
            traefik.ingress.kubernetes.io/router.tls: "true"
            traefik.ingress.kubernetes.io/router.tls.certresolver: cloudflare
            hajimari.io/enable: "true"
            hajimari.io/icon: server-network
            hajimari.io/group: media
            hajimari.io/appName: Silo
            hajimari.io/instance: svc
          enabled: true
          className: traefik
          hosts:
            - host: silo.homelab.lan
              paths:
                - path: /
                  service:
                    identifier: main
                    port: http
          tls:
            - hosts:
                - silo.homelab.lan
      persistence:
        silo-data:
          enabled: true
          type: persistentVolumeClaim
          accessMode: ReadWriteOnce
          size: 5Gi
          storageClass: '{{ kube.storage.default }}'
          globalMounts:
            - path: /var/lib/silo
        silo-transcode:
          enabled: true
          type: persistentVolumeClaim
          accessMode: ReadWriteOnce
          size: 10Gi
          storageClass: '{{ kube.storage.default }}'
          globalMounts:
            - path: /tmp/silo-transcode
        postgres-data:
          enabled: true
          type: persistentVolumeClaim
          accessMode: ReadWriteOnce
          size: 10Gi
          storageClass: '{{ kube.storage.default }}'
          advancedMounts:
            main:
              postgres:
                - path: /var/lib/postgresql
        redis-data:
          enabled: true
          type: persistentVolumeClaim
          accessMode: ReadWriteOnce
          size: 1Gi
          storageClass: '{{ kube.storage.default }}'
          advancedMounts:
            main:
              redis:
                - path: /data
              init-redis-permissions:
                - path: /data
        media:
          enabled: true
          type: nfs
          server: '{{ network.infra.synology.address }}'
          path: '{{ network.infra.synology.services.nfs.path }}/Media'
          globalMounts:
            - path: /mnt/media
      service:
        main:
          controller: main
          ports:
            http:
              port: 8080
    deployment: kluctl
    helmChart:
      namespace: media
      repo: https://bjw-s-labs.github.io/helm-charts
      chartName: app-template
      chartVersion: 4.6.2
      releaseName: silo
      skipCRDs: false
      skipPrePull: true
    kustomize:
      resources:
        - helm-rendered.yaml
      namespace: media
      labels:
        - pairs:
            app: silo
    tags:
      - media
      - silo
    volumes:
      silo-data:
        size: 5Gi
        storageClass: longhorn
      redis-data:
        size: 1Gi
        storageClass: longhorn
overlays:
  pvc: []
