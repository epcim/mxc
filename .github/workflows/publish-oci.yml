name: Publish MXC OCI Module

on:
  workflow_dispatch:
    inputs:
      version:
        description: CUE module version
        required: true
        default: v0.1.0

permissions:
  contents: read
  packages: write

env:
  GHCR_USER: epcim

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CUE
        run: |
          curl -fsSL https://github.com/cue-lang/cue/releases/download/v0.17.1/cue_v0.17.1_linux_amd64.tar.gz -o /tmp/cue.tar.gz
          tar -xzf /tmp/cue.tar.gz -C /tmp cue
          sudo install -m 0755 /tmp/cue /usr/local/bin/cue

      - name: Install just
        run: |
          curl -fsSL https://github.com/casey/just/releases/download/1.45.0/just-1.45.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/just.tar.gz
          tar -xzf /tmp/just.tar.gz -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Validate and publish
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          OCI_VERSION: ${{ inputs.version }}
        run: just oci-publish core "${OCI_VERSION}"
