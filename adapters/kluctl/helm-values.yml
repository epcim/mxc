# vim: ft=yaml syntax=yaml sts=2 ts=2 sw=2
{%- if context.management is defined and context.management.configmap is mapping -%}
{%- set patched = merge_dict(context, {"management": {"configmap": context.management.configmap | to_json}}) %}
{{ patched | to_yaml }}
{%- else %}
{{ context | to_yaml }}
{%- endif %}
